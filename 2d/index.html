<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keaunis Sensory Nursery Rhymes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="canvas-wrap">
      <svg id="scene" viewBox="0 0 1920 1080" role="img" aria-label="Nursery rhyme baby-friendly animal animation">
        <defs>
          <linearGradient id="skyFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#91d9ff" />
            <stop offset="100%" stop-color="#d8f3ff" />
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <rect x="0" y="0" width="1920" height="1080" fill="url(#skyFill)" />
        <circle id="sun" cx="1670" cy="180" r="95" fill="#ffd857" filter="url(#glow)" />

        <g id="cloudGroup"></g>
        <g id="hillsGroup"></g>
        <g id="sceneCharacters"></g>

        <g id="titleGroup">
          <text id="mainTitle" x="960" y="160" text-anchor="middle">Keaunis Sensory</text>
          <text id="subtitle" x="960" y="230" text-anchor="middle">Nursery Rhymes</text>
        </g>

        <g id="lyricCard">
          <rect x="360" y="770" width="1200" height="180" rx="36" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.65)" stroke-width="3" />
          <text id="lyricText" x="960" y="860" text-anchor="middle">Twinkle, twinkle, little star</text>
        </g>
      </svg>
    </div>

    <script src="scene.js"></script>
  </body>
</html>
