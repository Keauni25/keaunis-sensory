<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keaunis Sensory - Nursery Rhymes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="frame">
      <svg id="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Nursery rhyme animation scene">
        <defs>
          <linearGradient id="skyGradient" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#79d7ff" />
            <stop offset="100%" stop-color="#c7f0ff" />
          </linearGradient>
          <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="10" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <rect id="background" x="0" y="0" width="1920" height="1080" fill="url(#skyGradient)"/>
        <circle id="sun" cx="1700" cy="190" r="110" fill="#ffd75d" filter="url(#softGlow)"/>

        <g id="clouds">
          <g class="cloud cloud-1" transform="translate(230 120)">
            <circle cx="0" cy="0" r="40" fill="#ffffff"/>
            <circle cx="43" cy="-10" r="35" fill="#ffffff"/>
            <circle cx="80" cy="10" r="32" fill="#ffffff"/>
            <rect x="-10" y="20" width="110" height="38" rx="20" fill="#ffffff"/>
          </g>
          <g class="cloud cloud-2" transform="translate(720 170)">
            <circle cx="0" cy="0" r="44" fill="#ffffff"/>
            <circle cx="46" cy="-8" r="38" fill="#ffffff"/>
            <circle cx="90" cy="10" r="34" fill="#ffffff"/>
            <rect x="-12" y="22" width="126" height="42" rx="20" fill="#ffffff"/>
          </g>
        </g>

        <g id="ground">
          <rect x="0" y="760" width="1920" height="320" fill="#82d36a"/>
          <rect x="0" y="840" width="1920" height="240" fill="#62b85d"/>
        </g>

        <g id="sceneAnimals"></g>
        <g id="titleGroup" class="title-group">
          <text id="mainTitle" x="960" y="150" text-anchor="middle" class="title">Keaunis Sensory</text>
          <text id="subtitle" x="960" y="215" text-anchor="middle" class="subtitle">Nursery Rhymes</text>
        </g>

        <g id="lyricsDisplay">
          <rect x="360" y="760" width="1200" height="170" rx="30" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.55)" />
          <text id="lyricText" x="960" y="850" text-anchor="middle" class="lyric-text">Twinkle, twinkle, little star</text>
        </g>
      </svg>
    </div>

    <script src="scene.js"></script>
  </body>
</html>
